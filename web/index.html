<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Register graduates and keep their details in your browser. Export to Excel, back up to JSON, and restore from a backup.">
  <meta name="theme-color" content="#3949AB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Graduation Registration">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Graduation Registration</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The page is blank until Flutter has started, which can take a moment on a
    slow connection. This splash screen fills that gap and is removed as soon
    as the app draws its first frame.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F5F3FA;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F5F3FA;
      color: #49454F;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    #splash .spinner {
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border: 4px solid #D9DBF0;
      border-top-color: #3949AB;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div>Loading Graduation Registration…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
